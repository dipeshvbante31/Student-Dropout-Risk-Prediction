{% if page.pages > 1 %}
<nav class="pager" aria-label="Pagination">
  {% if page.has_prev %}<a class="btn btn-sm" href="{{ page_url(page.prev_num) }}">Previous</a>{% endif %}
  <span>Page {{ page.page }} of {{ page.pages }} ({{ page.total }} records)</span>
  {% if page.has_next %}<a class="btn btn-sm" href="{{ page_url(page.next_num) }}">Next</a>{% endif %}
</nav>
{% endif %}
