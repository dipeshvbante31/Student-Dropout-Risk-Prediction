services:
  - type: web
    name: student-dropout-risk
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: FLASK_APP=wsgi flask db upgrade && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - {key: APP_ENV, value: production}
      - {key: PYTHON_VERSION, value: 3.12.3}
      - {key: SECRET_KEY, generateValue: true}
      - {key: DATABASE_URL, fromDatabase: {name: dropout-db, property: connectionString}}
databases:
  - name: dropout-db
    plan: free
